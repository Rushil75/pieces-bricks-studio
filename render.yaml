# Render Blueprint for the Python API: render.com > New > Blueprint > pick this repo.
services:
  - type: web
    name: pieces-bricks-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free works for the demo (sleeps after 15 min idle, ~1 min to wake). Use "starter" for no sleep.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # your Netlify URL, e.g. https://pieces-bricks.netlify.app
      - key: DEMO_PASSWORD
        sync: false   # optional: leave empty for no password
