# Netlify hosts the page only; the Python API runs on Render (see render.yaml).
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The page calls the API directly (not through a Netlify proxy, which would time out on
  # long conversions). Change this if the Render service URL changes.
  VITE_API_BASE = "https://pieces-bricks-api.onrender.com"
