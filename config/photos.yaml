# Per-photo crop and settings. Anything in `defaults` can be overridden per job.
# Jobs are named <photo><version>; output goes to output/<job>_<size>_<variant>/.

defaults:
  engine: studio           # studio = port of the reference demo (24-stud plates, OKLab) | classic
  studio_palette: "40"     # "40" = original PhotoBricks 40 (as the reference) | current = palette.json (59)
  studio_colors: 40        # at most this many colours (fewer if a colour covers < 0.8 % of studs)
  studio_contrast: 10      # -30 .. 60
  studio_saturation: -2    # -30 .. 60 (reference demo as used by the client: -2)
  studio_smoothing: 0.6    # edge-preserving smoothing, 0 .. 1
  studio_local_contrast: 0.6  # 0 .. 1.5
  studio_dark_lines: 1.0   # darken eyes, brows, beard edges, 0 .. 2
  studio_detail: 0.1       # sharpening, 0 .. 0.6
  studio_dither: 0.0       # Floyd-Steinberg strength, 0 .. 1
  studio_bg_simplify: 0.7  # blur and mute outside the head-and-shoulders oval, 0 .. 1
  studio_auto_frame: true  # crop on the faces, tighter on small boards
  studio_brighten_face: true
  studio_auto_levels: true
  studio_auto_saturation: false  # pick saturation from how colourful the photo already is
  palette: client          # client = fixed 58 (C01-C58); adaptive = best colours for this photo
  colors: 60               # client's limit: at most 60 colours per mosaic (engine allows up to 256)
  face_weight: 6.0         # face cells count this much more when choosing adaptive colours
  kL: 0.6                  # CIEDE2000 lightness factor (<1 = lightness counts more: clean faces, crisp features)
  blend: "off"             # viewing-distance colour blending: off (clean, best for photos) |
                           # background (textured areas only, faces clean: natural look for paintings) | all
  blend_fidelity: 0.3      # textured areas: lower = more blending, higher = cleaner
  blend_max_extra: 4.0     # a blended brick may use only colours within this CIEDE2000 of its nearest
  blend_texture: [2.5, 6.0]  # local lightness variation (std, L*) where blending starts / is full
  blend_flat_fidelity: 5.0 # flat areas (no texture in the photo): stay one clean colour
  blend_face_fidelity: 1.0e+9  # faces: never blended, each brick keeps its own best colour
  client_colors: 20        # use the best 20 of the 59 client colours for each photo (0 = all)
  palette_reserve: 0.1     # share of colours kept for small details (eyes, lips)
  palette_polish: 10       # extra k-means steps after adding the detail colours
  grid_face_detail: 0.15   # brick-scale lightness sharpening inside faces (eyes, brows, mouth)
  detail: 1.0              # brick-scale lightness sharpening over the whole picture (page slider 0-5)
  contrast: 0              # page slider -100..100 (neutral: keeps the photo's colours true)
  brightness: 0
  grid_detail_sigma: 0.8   # in bricks
  face_score: 0.8
  crop: auto               # or [x, y, size] in original pixels
  crop_mode: auto          # auto | single (frame only the largest face)
  face_scale: 2.4          # single face: crop side = face size x this (2.4 = head + shoulders, face ~15 bricks at 48)
  shift_down: 0.12         # move crop centre down (fraction of crop side) to include shoulders
  group_pad: 1.6           # group: padding around all faces, in median face sizes
  upscale_min: 1000
  denoise_h: 3
  clahe_clip: 0.0          # keep off: local contrast creates halos and costs ~20 points of similarity
  clahe_tiles: 4
  sharpen: 0.0
  face_sharpen: 0.4
  sharpen_sigma: 1.5
  saturation: 1.0          # tuned for 48x48 / 60 colours: boosting costs similarity
  bg_filter: bilateral     # bilateral | meanshift | none
  bg_spatial: 12
  bg_color: 40
  bg_passes: 3
  dither_strength: 0.8
  dither_face_strength: 0.25
  dither_clamp: 12.0

jobs:
  p5:
    file: p5_man_colour_bg.png
    sizes: [48]
    face_scale: 2.5
    shift_down: 0.13

  p4:
    file: p4_toddler_bench.jpg
    sizes: [48]
    face_scale: 2.4
    shift_down: 0.16
    face_sharpen: 0.8

  p1:
    file: p1_girl_teddy.jpg
    sizes: [48]
    crop: [400, 960, 1120]   # her face, the teddy and the top of the drawing

  p2a:
    file: p2_studio_family.png
    sizes: [48, 96]
    crop: [0, 0, 850]

  p2b:
    file: p2_studio_family.png
    sizes: [48]
    crop: [150, 30, 540]     # father, little girl and mother

  p3a:
    file: p3_birthday_family.jpg
    sizes: [48, 96]
    group_pad: 2.0
    shift_down: 0.1
    bg_filter: meanshift
    bg_spatial: 16
    bg_color: 40

  p3b:
    file: p3_birthday_family.jpg
    sizes: [48]
    crop: [110, 225, 560]    # tight on the five faces
    bg_filter: meanshift
    bg_spatial: 16
    bg_color: 40
